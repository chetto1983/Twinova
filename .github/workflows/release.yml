name: Release

# Builds the Windows MSI and the Linux deb and AppImage, and publishes a GitHub release whose text
# is the version's CHANGELOG.md section. From chetto1983/ModbusTool's release.yml, without its
# signing (SignPath), updater (latest.json) and winget steps: Twinova has none of them yet
# (ROADMAP 2.4; the updater is 6.4). The installers are unsigned, and the release text says so.
#
# Start it by pushing a tag vX.Y.Z, or from the Actions tab (Run workflow) with the tag to
# create: the release then creates the tag on the commit the workflow ran on.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v0.1.0 (must match the app version)"
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  notes:
    runs-on: ubuntu-24.04
    outputs:
      body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: The tag matches the app version
        run: |
          version=$(jq -r .version app/src-tauri/tauri.conf.json)
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match the app version $version (app/src-tauri/tauri.conf.json)" >&2
            exit 1
          fi
      - name: CHANGELOG section of this version
        id: notes
        run: |
          body=$(awk -v v="${TAG#v}" '
            $0 ~ "^## v?" v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$body" ]; then
            echo "CHANGELOG.md has no section for $TAG" >&2
            exit 1
          fi
          {
            echo "body<<CHANGELOG_EOF"
            echo "$body"
            echo
            echo "The installers are not signed yet: Windows SmartScreen asks for confirmation on the first start."
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: notes
    strategy:
      matrix:
        include:
          - os: windows-latest
            bundles: msi
            artifact: windows
            files: app/src-tauri/target/release/bundle/msi/*.msi
          - os: ubuntu-24.04
            bundles: deb,appimage
            artifact: linux
            files: |
              app/src-tauri/target/release/bundle/deb/*.deb
              app/src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      # Reads the cache ci.yml's bundle job saves on main; releases never write it.
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: app/src-tauri
          shared-key: bundle
          save-if: false
      - name: System dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        timeout-minutes: 30
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: One Paraglide runtime in the frontend bundle
        run: node ../scripts/check-single-runtime.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          # Only passed to the publish job; the release keeps the packages.
          retention-days: 1

  publish:
    needs: [notes, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.notes.outputs.body }}
        run: |
          printf '%s\n' "$NOTES" > notes.md
          find assets -type f -exec ls -l {} +
          shopt -s globstar nullglob
          packages=(assets/**/*.msi assets/**/*.deb assets/**/*.AppImage)
          if [ "${#packages[@]}" -ne 3 ]; then
            echo "Expected an MSI, a deb and an AppImage, found: ${packages[*]}" >&2
            exit 1
          fi
          gh release create "$TAG" "${packages[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Twinova $TAG" --notes-file notes.md
