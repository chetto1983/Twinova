name: CI

# The ModbusTool set (chetto1983/ModbusTool .github/workflows/ci.yml), with the app under app/.

# Prose runs nothing: no build, test or workflow step of this CI reads a Markdown file or anything
# under docs/ (grep, 2026-11-07), so a change made only of them skips the run. The scheme is Aura's
# (chetto1983/Aura ci.yml): `paths` with negations, where a file a test reads could be re-included.
# Pushes run on main only; a working branch is checked by its pull_request run, so one SHA does not
# run twice. No tag trigger here, so `paths` cannot swallow a tag push.
#
# No job waits for another (user, 2026-11-08): with `needs`, a pull request took rust (4 to 8 min)
# plus the longest job after it. A failed rust job now costs the runner minutes of the others.
on:
  push:
    branches: ["main"]
    paths: &code-paths
      - "**"
      - "!**.md"
      - "!docs/**"
  pull_request:
    branches: ["main"]
    paths: *code-paths

permissions:
  contents: read

# A newer push to the same branch or pull request makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Without a shell key a step runs without pipefail (pattern from Aura's workflows). A job's own
# defaults replace these, so every job that sets a working directory repeats the shell.
defaults:
  run:
    shell: bash

jobs:
  rust:
    runs-on: ubuntu-24.04
    # Dev and test builds without debug info, which CI does not use, as mutation.yml does. Debug info is
    # 62 % of a dependency's rlib and 94 % of the app's binaries (measured 2026-11-08), so the caches
    # shrink, and with them the repository's total under GitHub's 10 GB limit, past which the least
    # recently used entries are evicted: this job found no cache in run 42463081110. Only on the jobs
    # that build dev or test profiles: rust-cache hashes every CARGO* variable into its key, and the
    # bundle cache must keep the key release.yml computes.
    env: &no-debug-info
      CARGO_PROFILE_DEV_DEBUG: "0"
    defaults:
      run:
        shell: bash
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: System dependencies
        uses: ./.github/actions/linux-deps
        timeout-minutes: 30
      # The toolchain app/src-tauri/rust-toolchain.toml pins (trust-runtime needs 1.99).
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy, llvm-tools-preview
      # One writer per cache, as in Aura: main saves, branches and PRs only read, so a branch
      # push never evicts the entry main's next run needs.
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: app/src-tauri
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2
        with:
          tool: cargo-llvm-cov
      - name: Frontend dist placeholder (required by tauri::generate_context)
        run: mkdir -p ../dist
      # --workspace: the app and the project format crate (app/src-tauri/project).
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests with coverage gate (85% of lines, CLAUDE.md)
        run: cargo llvm-cov --workspace --fail-under-lines 85 --summary-only

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Translations complete (messages/, project.inlang)
        run: npm run check:i18n
      - run: npm run format:check
      - run: npm run deadcode
      - run: npm run dup
      - name: Tests with coverage gate (85%, vite.config.ts thresholds)
        run: npm run coverage
      - run: npm run build

  file-size:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash scripts/check-file-size.sh

  # The installers release.yml publishes (ROADMAP 2.4): MSI on Windows, deb and AppImage on Linux.
  # Built, not uploaded: the sizes are in the log. Unlike ModbusTool, only on main (user, 2026-11-08):
  # the MSI was the longest job of a pull request (6 to 12 min), and the E2E already builds and drives
  # the app on both platforms there.
  bundle:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi
          - os: ubuntu-24.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      # Shared with release.yml: a tag builds from main's warm dependency cache.
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: app/src-tauri
          shared-key: bundle
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        timeout-minutes: 30
      # Tauri's bundler downloads WiX (MSI) and linuxdeploy with AppRun (AppImage) from GitHub releases
      # into dirs::cache_dir()/tauri, unless they are already there (tauri-bundler 2.10.4,
      # bundle/windows/msi/mod.rs and bundle/linux/appimage/linuxdeploy.rs), once and with no retry.
      # GitHub answered 504 to it three times in a row on main, so the tools are cached, and fetched
      # with retries by scripts/fetch-bundler-tools.sh when the cache is empty.
      - name: Bundler tools directory
        id: tools
        run: |
          if [ "$RUNNER_OS" = Windows ]; then base=$(cygpath -m "$LOCALAPPDATA"); else base="${XDG_CACHE_HOME:-$HOME/.cache}"; fi
          echo "dir=$base/tauri" >> "$GITHUB_OUTPUT"
      # Saved here, on main only (this job runs on pushes to main); release.yml only reads it.
      - id: tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ steps.tools.outputs.dir }}
          key: tauri-tools-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: tauri-tools-${{ runner.os }}-
      - name: Bundler tools, fetched with retries when not cached
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: bash ../scripts/fetch-bundler-tools.sh "${{ steps.tools.outputs.dir }}" "$RUNNER_OS"
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.bundles }}
      - name: One Paraglide runtime in the frontend bundle
        run: node ../scripts/check-single-runtime.mjs
      # The binary inside the installers is ROADMAP 2.5's size baseline.
      - name: Installer and binary sizes
        run: |
          ls -l "src-tauri/target/release/twinova${{ runner.os == 'Windows' && '.exe' || '' }}"
          installers=$(find src-tauri/target/release/bundle -maxdepth 2 -type f \( -name '*.msi' -o -name '*.deb' -o -name '*.AppImage' \))
          test -n "$installers"
          ls -l $installers

  # The project format, the line physics, the run engine and the agent server on Windows: twinova-project,
  # twinova-physics, twinova-engine and twinova-agent have no Tauri dependency, so their test binaries start there,
  # unlike the app's (0xc0000139, below).
  # Linux runs them in rust. The physics tests pin a state fingerprint that must match Linux's (spec
  # 2026-11-09-component-behaviour-design.md); the engine's run the field and the controller on truST there too (spec
  # 2026-11-11-agent-server-design.md).
  project-windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: app/src-tauri
          shared-key: project
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test -p twinova-project -p twinova-physics -p twinova-engine -p twinova-agent

  # The real app through tauri-driver (npm run e2e: e2e/run.mjs, project.mjs, line.mjs, curve.mjs, sort.mjs, code_sort.mjs and editor.mjs), on both desktop platforms Tauri can drive.
  # As in ModbusTool, Windows is tested here and not with cargo test: tauri-build embeds the Common
  # Controls v6 manifest in binaries only, so a test binary that links tauri does not start there
  # (0xc0000139, measured on this repository's run 42378063592).
  e2e:
    strategy:
      fail-fast: false
      matrix:
        # Not windows-latest: on windows-2025 msedgedriver cannot attach to WebView2 even at matching
        # versions (ModbusTool, 2026-11-06; https://github.com/actions/runner-images/issues/14738).
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env: *no-debug-info
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: app/src-tauri
          shared-key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        timeout-minutes: 30
        with:
          extra: webkit2gtk-driver xvfb
      - run: cargo install tauri-driver --locked --version 2.1.0
      # tauri-driver drives Edge WebView2 through msedgedriver, whose version must match the
      # WebView2 on the runner (https://v2.tauri.app/develop/tests/webdriver/ci/).
      - name: Edge driver matching WebView2
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
          # The driver must match WebView2, which can differ from Edge: print both to compare.
          $webview = Get-ItemProperty "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}" -ErrorAction SilentlyContinue
          $edge = (Get-Item "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe" -ErrorAction SilentlyContinue).VersionInfo.ProductVersion
          Write-Output "WebView2 $($webview.pv), Edge $edge, $(& .\msedgedriver.exe --version)"
      - run: npm ci
      - run: npx tauri build --debug --no-bundle
      # Software GL and no DMA-BUF renderer: the three.js view under Xvfb, as measured for M1.
      - name: E2E (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1440x900x24" npm run e2e
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
          LIBGL_ALWAYS_SOFTWARE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
      - name: E2E (Windows)
        if: runner.os == 'Windows'
        run: npm run e2e
        env:
          E2E_OUT: ${{ runner.temp }}/e2e
      # Failure screenshots and the driver's log, to read a failure without guessing.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: e2e-${{ runner.os }}
          path: ${{ runner.temp }}/e2e
          if-no-files-found: ignore
          retention-days: 7
