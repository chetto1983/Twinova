[package]
name = "twinova"
version = "0.1.0"
description = "Open-source 3D factory simulator and virtual-commissioning tool"
authors = ["The Twinova contributors"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.99"

# The project format and the run engine are crates of their own without Tauri, so their tests also run on Windows, where
# a test binary that links Tauri does not start (0xc0000139, run 42378063592).
[workspace]
members = ["project", "physics", "engine", "agent"]

[lib]
name = "twinova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native dialogs to pick project folders and archives (ROADMAP 4.2), the official plugin. MIT OR Apache-2.0.
tauri-plugin-dialog = "=2.8.4"
# The project format (spec 2026-11-08-project-format-design.md), a crate of this workspace without Tauri.
twinova-project = { path = "project" }
# The run engine (spec 2026-11-11-agent-server-design.md), a crate of this workspace without Tauri, which the agent
# server shares.
twinova-engine = { path = "engine" }
# The editor's interfaces and joins (spec 2026-11-11-snapping-design.md), built by the line's own physics geometry.
twinova-physics = { path = "physics" }
# Watching the project folder for sources saved in VS Code (spec 2026-11-12-st-vscode-design.md). CC0-1.0; the version
# trust-runtime's `full` feature already builds, so no crate is added.
notify = "=8.2.1"
# The in-app ST editor's diagnostics, hover and completion (spec 2026-11-12-st-editor-design.md): truST's language
# frontend at v0.39.0, followed upstream as the 2.6 policy says (spec 2026-11-07-trust-upstream-policy-design.md). The
# runtime stays at 6405915, so trust-syntax, trust-hir and trust-ide are built at both revisions. MIT OR Apache-2.0.
trust-wasm-analysis = { git = "https://github.com/johannesPettersson80/trust-platform", rev = "5eb7f8cd9c137840a5a5db8049edae99c481ace9" }

[dev-dependencies]
# mock_app for the command tests (src/commands_tests.rs), as in chetto1983/ModbusTool.
tauri = { version = "2", features = ["test"] }
# Temporary project folders for the project command tests; the version the lockfile already has.
tempfile = "=3.27.0"

# The webview's language under a C locale (src/webview_locale.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# Rapier and truST optimised in dev builds too: the line tests step tens of thousands of 1 ms frames through the
# physics and two ST runtimes, and cargo mutants reruns them for every mutant against a 60 s timeout (mutation.yml).
[profile.dev.package.rapier3d]
opt-level = 3
[profile.dev.package.parry3d]
opt-level = 3
[profile.dev.package.trust-runtime]
opt-level = 3
[profile.dev.package.trust-runtime-core]
opt-level = 3
[profile.dev.package.trust-hir]
opt-level = 3
[profile.dev.package.trust-syntax]
opt-level = 3

# cargo mutants builds every mutant with this profile (.cargo/mutants.toml): the test profile without debug info, which
# a mutant's failing test does not need (https://mutants.rs/performance.html). It keeps the dev profile's optimised
# Rapier and truST (the tests ran as fast). Measured in .cargo/mutants.toml; CI set the same with
# CARGO_PROFILE_DEV_DEBUG before.
[profile.mutants]
inherits = "test"
debug = "none"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# trust-runtime asks for tiverse-mmap 1.0.0, which does not build on Windows (VirtualAlloc and LockFileEx
# take typed flags in windows 0.52). truST's workspace patches it with its fixed copy (trust-platform
# Cargo.toml, [patch.crates-io]), but a patch does not reach dependents, so it is repeated here.
[patch.crates-io]
tiverse-mmap = { git = "https://github.com/johannesPettersson80/trust-platform", rev = "6405915973a77587748ffb061a61d37bb8a368b0" }
