[package]
name = "twinova"
version = "0.1.0"
description = "Open-source 3D factory simulator and virtual-commissioning tool"
authors = ["The Twinova contributors"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.99"

[lib]
name = "twinova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# truST at the last commit read that still has its bytecode VM (deleted upstream on 2026-10-24):
# docs/research/10-st-senza-compilazione.md. MIT OR Apache-2.0.
trust-runtime = { git = "https://github.com/johannesPettersson80/trust-platform", rev = "6405915973a77587748ffb061a61d37bb8a368b0", default-features = false, features = ["full"] }

# The webview's language under a C locale (src/webview_locale.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
