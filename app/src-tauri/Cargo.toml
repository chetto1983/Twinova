[package]
name = "twinova"
version = "0.1.0"
description = "Open-source 3D factory simulator and virtual-commissioning tool"
authors = ["The Twinova contributors"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.99"

# The project format is its own crate without Tauri, so its tests also run on Windows, where a test binary that links
# Tauri does not start (0xc0000139, run 42378063592).
[workspace]
members = ["project", "physics"]

[lib]
name = "twinova_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# truST at the last commit read that still has its bytecode VM (deleted upstream on 2026-10-24):
# docs/research/10-st-senza-compilazione.md. MIT OR Apache-2.0.
# Native dialogs to pick project folders and archives (ROADMAP 4.2), the official plugin. MIT OR Apache-2.0.
tauri-plugin-dialog = "=2.8.4"
# The project format (spec 2026-11-08-project-format-design.md), a crate of this workspace without Tauri.
twinova-project = { path = "project" }
twinova-physics = { path = "physics" }
trust-runtime = { git = "https://github.com/johannesPettersson80/trust-platform", rev = "6405915973a77587748ffb061a61d37bb8a368b0", default-features = false, features = ["full"] }

[dev-dependencies]
# mock_app for the command tests (src/commands_tests.rs), as in chetto1983/ModbusTool.
tauri = { version = "2", features = ["test"] }
# Property tests of the event order (CLAUDE.md, "property-based tests for ... the event queue"). MIT OR Apache-2.0.
proptest = "1.12"
# Temporary project folders for the project command tests; the version the lockfile already has.
tempfile = "=3.27.0"

# The webview's language under a C locale (src/webview_locale.rs).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# Rapier and its geometry crate optimised in dev builds too: the physics tests step thousands of 1 ms frames.
[profile.dev.package.rapier3d]
opt-level = 3
[profile.dev.package.parry3d]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# trust-runtime asks for tiverse-mmap 1.0.0, which does not build on Windows (VirtualAlloc and LockFileEx
# take typed flags in windows 0.52). truST's workspace patches it with its fixed copy (trust-platform
# Cargo.toml, [patch.crates-io]), but a patch does not reach dependents, so it is repeated here.
[patch.crates-io]
tiverse-mmap = { git = "https://github.com/johannesPettersson80/trust-platform", rev = "6405915973a77587748ffb061a61d37bb8a368b0" }
