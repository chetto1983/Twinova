[package]
name = "twinova-engine"
version = "0.3.0"
description = "Twinova's run engine: the line (physics, field and controller) in lockstep on virtual time, with no UI dependency"
authors = ["The Twinova contributors"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
# truST at the last commit read that still has its bytecode VM (deleted upstream on 2026-10-24):
# docs/research/10-st-senza-compilazione.md. MIT OR Apache-2.0.
trust-runtime = { git = "https://github.com/johannesPettersson80/trust-platform", rev = "6405915973a77587748ffb061a61d37bb8a368b0", default-features = false, features = ["full"] }
# PLCopen TC6 XML read in document order, the version the Ladder crate reads it with. MIT OR Apache-2.0.
roxmltree = "=0.21.2"
# truST's frontend as the patched runtime builds it (the root manifest's [patch], whose rev it follows): the same
# package, for the parameter directions of the runtime's program model, which trust-runtime does not re-export. MIT OR
# Apache-2.0.
trust-hir = { git = "https://github.com/chetto1983/trust-platform", rev = "0d09efe160a1ef4f8db90a659ab536f95251ad63" }
twinova-ladder = { path = "../ladder" }
# truST's ST parser, the same package (the root manifest's [patch], whose rev it follows): a Ladder file's declarations
# read for PLCopen's <interface> (spec 2026-11-13-ladder-editor-design.md, Task 5, the user's choice). MIT OR
# Apache-2.0.
trust-syntax = { git = "https://github.com/chetto1983/trust-platform", rev = "0d09efe160a1ef4f8db90a659ab536f95251ad63" }
twinova-physics = { path = "../physics" }
twinova-project = { path = "../project" }
