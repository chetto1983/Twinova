# cargo mutants configuration (https://mutants.rs). Scope (CLAUDE.md "MUTATION >=70%"; the gate in mutation.yml
# allows no survivor): the run engine and the line loop, the field runtime and the controller (4.3), the line physics
# (crate twinova-physics), and the project format's address parser, validation, codec and storage (4.2).
# mutation.yml runs it with --workspace.
examine_globs = [
  "src/engine.rs", "src/line.rs", "src/drive.rs", "src/field.rs", "src/field_image.rs", "src/controller.rs",
  "project/src/address.rs", "project/src/codec.rs", "project/src/validate.rs", "project/src/validate_scene.rs",
  "project/src/storage.rs", "project/src/archive.rs",
  "physics/src/world.rs", "physics/src/world_devices.rs", "physics/src/layout.rs", "physics/src/layout_devices.rs",
  "physics/src/path.rs", "physics/src/surfaces.rs",
]
# Equivalent mutants, each with its reason (CLAUDE.md "MUTATION").
exclude_re = [
  # field_image.rs `place`: the slot only names which of the two counters an area uses; `!=` swaps the names, and each
  # area still counts in a counter of its own.
  "src/field_image.rs:.*replace == with != in place",
]
