# cargo mutants configuration (https://mutants.rs). Scope (CLAUDE.md "MUTATION >=70%"; the gate in mutation.yml
# allows no survivor): the run engine and the line loop, the field runtime and the controller (4.3; crate twinova-engine), the line physics
# (crate twinova-physics), the project format's address parser, model, validation, codec and storage (4.2), and the agent server's
# sessions and tools (2.7).
# mutation.yml runs it with --workspace.
# Every mutant builds with Cargo.toml's `mutants` profile, the test profile without debug info
# (https://mutants.rs/performance.html). Measured 2026-11-11, per mutant, in place, against the test profile: physics
# path.rs 2.80 → 2.58 s (build 0.73 → 0.58 s), engine drive.rs 12.37 → 11.35 s (build 1.74 → 1.15 s); the tests, not
# the builds, are most of the time.
profile = "mutants"
examine_globs = [
  "engine/src/engine.rs", "engine/src/line.rs", "engine/src/drive.rs", "engine/src/field.rs",
  "engine/src/field_image.rs", "engine/src/controller.rs", "engine/src/build.rs", "engine/src/locate.rs",
  "engine/src/line_bind.rs", "engine/src/watch.rs", "engine/src/controller_monitor.rs", "engine/src/debugger.rs", "engine/src/debugger_kinds.rs",
  "src/watch.rs", "src/analysis.rs", "src/monitor.rs", "src/monitor_ladder.rs", "src/navigation.rs", "src/call_templates.rs",
  "src/positions.rs",
  "ladder/src/parse.rs", "ladder/src/print.rs", "ladder/src/lower.rs", "ladder/src/lower_rung.rs",
  "ladder/src/lower_boxes.rs", "ladder/src/program.rs", "engine/src/program_files.rs",
  "ladder/src/plcopen_read.rs", "ladder/src/plcopen_read_graph.rs", "ladder/src/plcopen_write.rs",
  "engine/src/plcopen.rs", "engine/src/plcopen_interface.rs", "engine/src/ladder_catalog.rs",
  "project/src/address.rs", "project/src/codec.rs", "project/src/validate.rs", "project/src/validate_scene.rs",
  "project/src/storage.rs", "project/src/archive.rs", "project/src/model.rs", "project/src/edit.rs",
  "project/src/history.rs", "project/src/library.rs", "project/src/sources.rs",
  "physics/src/world.rs", "physics/src/world_devices.rs", "physics/src/world_products.rs",
  "physics/src/world_sensors.rs", "physics/src/layout.rs", "physics/src/layout_conveyor.rs", "physics/src/layout_devices.rs",
  "physics/src/layout_sensors.rs", "physics/src/layout_merge.rs", "physics/src/interfaces.rs",
  "physics/src/snap.rs", "physics/src/interfaces_view.rs",
  "physics/src/path.rs", "physics/src/surfaces.rs",
  "agent/src/lib.rs", "agent/src/session.rs", "agent/src/tools_run.rs", "agent/src/tools_edit.rs",
]
# Equivalent mutants, each with its reason (CLAUDE.md "MUTATION").
exclude_re = [
  # field_image.rs `place`: the slot only names which of the two counters an area uses; `!=` swaps the names, and each
  # area still counts in a counter of its own.
  "engine/src/field_image.rs:.*replace == with != in place",
  # layout_merge.rs `meeting`: the angle from square comes out of a quaternion and acos in f32, so no pose gives exactly
  # MERGE_SQUARE (0.1°); `>` and `>=` differ on no input a scene can produce.
  "physics/src/layout_merge.rs:.*replace <= with < in meeting",
  # snap.rs `pose_onto`: a turn's w is exactly 0 only for a half turn, where q and -q are one rotation either way, and
  # from_rotation_y(π) in f64 gives w = 6e-17, never 0; `<` and `<=` differ on no turn a join produces.
  "physics/src/snap.rs:.*replace < with <= in pose_onto",
  # debugger_kinds.rs `pieces`: '{' and '}' never sit at one byte offset, so `o < c` and `o <= c` agree on every
  # message.
  "engine/src/debugger_kinds.rs:.*replace < with <= in pieces",
  # plcopen_read_graph.rs `with_heads`: a comment or a label is an element of its own, so its index in the file is
  # never a network's, which is one of its elements' or usize::MAX for an empty one; `>` and `>=` agree on every file.
  "ladder/src/plcopen_read_graph.rs:.*replace > with >= in Reader<'a, 'i>::with_heads",
]
